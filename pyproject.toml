[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "postvton"
version = "0.1.0"
description = "PostVTON: agentic post-processing for virtual try-on"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "PostVTON" }]

# Keep base deps light; install full stacks via requirements.*.txt.
dependencies = [
  "pillow>=10.0",
  "requests>=2.31.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Convenience extras mirroring the repo's requirements files.
# (These may be heavy; use only if you want one-shot installs.)
system = [
  "accelerate==0.32.0",
  "diffusers==0.24.0",
  "matplotlib",
  "opencv_python==4.10.0.84",
  "pillow==10.3.0",
  "PyYAML==6.0.1",
  "scipy==1.13.1",
  "scikit-image==0.24.0",
  "tqdm==4.66.4",
  "transformers==4.46.3",
  "fvcore==0.1.5.post20221221",
  "cloudpickle==3.0.0",
  "omegaconf==2.3.0",
  "pycocotools==2.0.8",
  "av==12.3.0",
  "gradio==4.43.0",
  "peft>=0.17.0",
  "huggingface_hub==0.26.0",
  "requests>=2.31.0",
  "carvekit",
  "config==0.5.1",
  "einops==0.7.0",
  "mediapipe==0.10.21",
  "bitsandbytes>=0.46.1",
  "onnxruntime",
  "scikit-learn",
  "ultralytics",
  "langgraph",
  "google-genai",
]
tryon-server = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "python-multipart>=0.0.9",
]

[project.scripts]
postvton-pipeline = "postvton.pipeline:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["postvton*"]
